services:
  redis:
    image: redis:7-alpine
    container_name: nocturn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  server:
    image: ghcr.io/bottle-nex/nocturn-server:latest
    container_name: nocturn-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SERVER_NODE_ENV=production
    depends_on:
      - redis

  orchestrator:
    image: ghcr.io/bottle-nex/nocturn-orchestrator:latest
    container_name: nocturn-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis

volumes:
  redis-data:
