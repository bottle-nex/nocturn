name: Deploy to EC2

on:
  push:
    branches: [prod]

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/bottle-nex/nocturn-server
  ORCHESTRATOR_IMAGE: ghcr.io/bottle-nex/nocturn-orchestrator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.ORCHESTRATOR_IMAGE }}:latest
            ${{ env.ORCHESTRATOR_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to ghcr.io
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # Pull latest images
            docker pull ${{ env.SERVER_IMAGE }}:latest
            docker pull ${{ env.ORCHESTRATOR_IMAGE }}:latest

            # Run database migrations
            cd ~/nocturn
            docker run --env-file .env --rm ${{ env.SERVER_IMAGE }}:latest npx prisma migrate deploy

            # Restart services with new images
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -f
